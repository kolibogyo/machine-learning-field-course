name: Weather alert

# Napi automatikus indítás reggel 7-kor, valamint kézi indítás
on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Vienna"
    workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email to my sender Gmail account"
        type: boolean
        default: false

# A repository tartalmának olvasási jogosultsága
permissions:
  contents: read

# A GitHub gépén végrehajtandó feladat
jobs:
  weather:
    runs-on: ubuntu-latest

    # Az R-scriptnek átadott futtatási beállítások
    env:
      RUN_MODE: morning
      DRY_RUN: "false"
      SMTP_USER: ${{ secrets.EMAIL }}
      SMTP_PASSWORD: ${{ secrets.PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAILTO }}

    steps:
      # A repository fájljainak letöltése a futtató gépre
      - name: Download repository
        uses: actions/checkout@v6

      # Az R telepítése a futtató gépre
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # A szükséges R-csomagok és függőségeik telepítése
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::blastula
            any::tidyverse
            any::glue
          dependencies: 'NA'
          install-quarto: false

      # Az időjárásjelentő script elindítása
            # Kézzel kiválasztott levélküldési próba
      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        shell: Rscript {0}
        run: |
          library(blastula)
          sender <- Sys.getenv("SMTP_USER")
          if (!nzchar(sender) || !nzchar(Sys.getenv("SMTP_PASSWORD"))) {
            stop("Missing EMAIL or PASSWORD repository secret.")
          }
          smtp_send(
            email = compose_email(body = md("Test email from GitHub Actions.")),
            to = sender,
            from = sender,
            subject = "Rain alert: Test email",
            credentials = creds_envvar(
              user = sender,
              pass_envvar = "SMTP_PASSWORD",
              provider = "gmail"
            )
          )
          message("The SMTP server accepted the test email.")

      # Az időjárásjelentő script elindítása
      - name: Run weather script
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: |
          Rscript weather_alert.R
          cat data/rain-alert-log.txt