name: Weather alert

# A futtatás kézi indításának engedélyezése
on:
  workflow_dispatch:

# A repository tartalmának olvasási jogosultsága
permissions:
  contents: read

# A GitHub gépén végrehajtandó feladat
jobs:
  weather:
    runs-on: ubuntu-latest

    # Az R-scriptnek átadott futtatási beállítások
    env:
      RUN_MODE: evening
      DRY_RUN: "true"

    steps:
      # A repository fájljainak letöltése a futtató gépre
      - name: Download repository
        uses: actions/checkout@v6

      # Az R telepítése a futtató gépre
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # A szükséges R-csomagok és függőségeik telepítése
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::blastula
          dependencies: 'NA'
          install-quarto: false

      # Az időjárásjelentő script elindítása
      - name: Run weather script
        run: Rscript weather_alert.R